<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガレス：素手・納刀・抜刀</title><style>body{margin:0;padding:18px;background:#10272a;color:#eee4ce;font-family:system-ui}h1{font-size:22px}nav{display:flex;gap:10px;margin:16px 0}button,a{font:inherit;color:#eee4ce;background:#25454a;border:1px solid #b79a60;padding:10px}button[aria-pressed=true]{background:#755d32}main{display:flex;gap:12px}section{width:50%;text-align:center}canvas{width:100%;height:auto;background:repeating-conic-gradient(#234349 0 25%,#1b373c 0 50%) 0/20px 20px}#status{min-height:25px}</style><h1>ガレス：素手・納刀・抜刀の比較</h1><p>同じ素体で3状態を切り替えます。鞘の取り付け・前後の整合は採否待ちです。</p><nav><button data-state="empty">素手</button><button data-state="sheathed">納刀</button><button data-state="drawn">抜刀</button></nav><p id="status" role="status"></p><main><section>正面<canvas id="front"></canvas></section><section>背面<canvas id="back"></canvas></section></main><p><a id="project" href="state-drawn.json" download>表示中の編集データを保存</a></p><script src="../../core.js"></script><script>
(async()=>{const C=StandeeCore,projects={},images=new Map();for(const name of ['empty','sheathed','drawn']){const p=C.parseProject(await(await fetch('state-'+name+'.json')).text());projects[name]=p;for(const v of C.VIEWS)for(const l of C.LAYERS){const u=p.views[v.id].layers[l.id].image;if(u&&!images.has(u)){const im=new Image();im.src=u;await im.decode();images.set(u,im);}}}function show(name){const p=projects[name];for(const v of C.VIEWS){const c=document.getElementById(v.id);c.width=C.WIDTH;c.height=C.HEIGHT;C.drawView(c.getContext('2d'),p.views[v.id],images,(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;});}document.getElementById('status').textContent=p.source;document.getElementById('project').href='state-'+name+'.json';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===name)));}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.state));show('drawn');})().catch(e=>document.getElementById('status').textContent=e.message);
</script></html>
