<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガレス：背面の腕の重なりの比較</title><style>body{margin:0;padding:18px;background:#10272a;color:#eee4ce;font-family:system-ui}h1{font-size:22px}nav{display:flex;gap:10px;margin:16px 0}button,a{font:inherit;color:#eee4ce;background:#25454a;border:1px solid #b79a60;padding:10px}button[aria-pressed=true]{background:#755d32}main{display:flex;gap:12px}section{width:50%;text-align:center}canvas{width:100%;height:auto;background:repeating-conic-gradient(#234349 0 25%,#1b373c 0 50%) 0/20px 20px}#status{min-height:25px}</style><h1>ガレス：納刀の背面・腕の重なりの比較</h1><p><strong>候補です。まだ採用していません。</strong>新候補は、背面の素体から人物の左腕（画面左）を切り出して手前の層に重ね、鞘の上に腕が来るようにしたものです。腕は元の素体画像をそのまま切り抜いたもので、描き直していません。旧候補は鞘を24px左へずらしただけのものです。正面は両者同じです。</p><nav><button data-state="old">旧候補（24px調整のみ）</button><button data-state="new">新候補（腕を手前に重ねる）</button></nav><p id="status" role="status"></p><main><section>正面<canvas id="front"></canvas></section><section>背面<canvas id="back"></canvas></section></main><p><a id="project" href="state-sheathed-back-occluded.json" download>表示中の編集データを保存</a></p><script src="../../core.js"></script><script>
(async()=>{const C=StandeeCore,files={old:'state-sheathed-back-aligned.json',new:'state-sheathed-back-occluded.json'},projects={},images=new Map();for(const name in files){const p=C.parseProject(await(await fetch(files[name])).text());projects[name]=p;for(const v of C.VIEWS)for(const l of C.LAYERS){const u=p.views[v.id].layers[l.id].image;if(u&&!images.has(u)){const im=new Image();im.src=u;await im.decode();images.set(u,im);}}}function show(name){const p=projects[name];for(const v of C.VIEWS){const c=document.getElementById(v.id);c.width=C.WIDTH;c.height=C.HEIGHT;C.drawView(c.getContext('2d'),p.views[v.id],images,(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;});}document.getElementById('status').textContent=(name==='new'?'新候補：背面の左腕を鞘の手前に重ねています':'旧候補：背面の鞘を24px左へずらしただけです');document.getElementById('project').href=files[name];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===name)));}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.state));show('new');})().catch(e=>document.getElementById('status').textContent=e.message);
</script></html>
