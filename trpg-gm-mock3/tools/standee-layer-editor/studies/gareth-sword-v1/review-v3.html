<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガレス：前後の握り比較</title><style>body{margin:0;padding:20px;background:#10272a;color:#eee4ce;font-family:system-ui}h1{font-size:22px}main{display:flex;gap:12px}section{width:50%;text-align:center}canvas{width:100%;height:auto;background:repeating-conic-gradient(#234349 0 25%,#1b373c 0 50%) 0/20px 20px}a{color:#d9bf80}</style><h1>ガレス：正面と背面の装備試作</h1><p>正面を保持し、背面の右手と遮蔽を試しています。未採用です。</p><main><section>正面<canvas id="front"></canvas></section><section>背面<canvas id="back"></canvas></section></main><p><a href="../../index.html">編集ツールへ戻る</a></p><p id="error"></p><script src="../../core.js"></script><script>
(async()=>{const C=StandeeCore,p=C.parseProject(await(await fetch('project-front-back-v3.json')).text()),images=new Map();for(const v of C.VIEWS)for(const l of C.LAYERS){const u=p.views[v.id].layers[l.id].image;if(u&&!images.has(u)){const im=new Image();im.src=u;await im.decode();images.set(u,im);}}for(const v of C.VIEWS){const c=document.getElementById(v.id);c.width=C.WIDTH;c.height=C.HEIGHT;C.drawView(c.getContext('2d'),p.views[v.id],images,(w,h)=>{const x=document.createElement('canvas');x.width=w;x.height=h;return x;});}})().catch(e=>document.getElementById('error').textContent=e.message);
</script></html>
