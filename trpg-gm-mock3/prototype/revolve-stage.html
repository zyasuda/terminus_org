<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>背景を回す場面転換</title>
<style>
:root{color-scheme:dark;--bg:#101817;--text:#eee9dc;--gold:#dabc79}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.5 system-ui,sans-serif}
#stage{position:fixed;inset:0}#stage canvas{width:100%;height:100%;display:block}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
#place{position:fixed;left:16px;top:12px;font-family:Georgia,"Yu Mincho",serif;font-size:22px;text-shadow:0 1px 4px #000}
#go{position:fixed;right:16px;bottom:16px;background:#101817cc;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:10px 16px;font:inherit;cursor:pointer}#go:disabled{opacity:.5;cursor:default}
</style>
<div id="stage"></div><div id="fade"></div><div id="place"></div><button id="go">場面を変える</button>
<script type="module">
import * as THREE from './vendor/three/three.module.min.js';
// 背景の板を今の位置のまま、縦の中心線を軸に回す。真横を向いた瞬間に次の場面の絵へ差し替え、
// 残りの半分を回して正面へ戻す（裏返った絵を見せないため）。板の端が客席側へ振り出すので、回る間だけカメラを引く。
// 舞台・床・照明・カメラの値はゲーム（stage.js・scenario.js、2026-10-07時点）と同じ。
const stageZ=z=>1+(z-1)*2.6/4.5,FOV=65,HORIZON=54;
const SCENES=[
 {name:'坑道入口',bg:'../replay/img/mine_entrance_unlit.webp',aspect:614/1100,floor:'#b6c0dc',sky:'#182027',cart:true},
 {name:'石扉の広間',bg:'../replay/img/s2_junction.webp',aspect:619/1100,floor:'#8793a7',sky:'#151b20',cart:false},
];
const PARTY=[
 {id:'ines',cm:155,x:-4.5,z:2.2,sheet:{width:793,height:1251,figure:[261,65,615,1177]}},
 {id:'brom',cm:135,x:-1.5,z:1.13,sheet:{width:924,height:1029,figure:[100,85,824,959]}},
 {id:'gareth',cm:184,x:1.5,z:1.13,sheet:{width:780,height:1444,figure:[93,93,703,1354]}},
 {id:'lydia',cm:172,x:4.5,z:2.2,sheet:{width:780,height:1444,figure:[149,87,655,1358]}},
];
const host=document.getElementById('stage'),fadeEl=document.getElementById('fade'),placeEl=document.getElementById('place'),go=document.getElementById('go');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(SCENES[0].sky);
const camera=new THREE.PerspectiveCamera(FOV,1,.1,200);
const loader=new THREE.TextureLoader(),cache=new Map(),tex=(u,srgb=true)=>{if(!cache.has(u)){const t=loader.load(u);if(srgb)t.colorSpace=THREE.SRGBColorSpace;cache.set(u,t);}return cache.get(u);};
const ambient=new THREE.HemisphereLight('#a9bac6','#51412e',1.2);scene.add(ambient);
const lantern=new THREE.PointLight('#ffcc86',8,22,1);lantern.position.set(4.5,3,2.2);scene.add(lantern);
// 床（ゲームと同じ）
const fc=document.createElement('canvas');fc.width=4;fc.height=512;const fx=fc.getContext('2d'),fg=fx.createLinearGradient(0,185,0,265);fg.addColorStop(0,'#000');fg.addColorStop(1,'#fff');fx.fillStyle=fg;fx.fillRect(0,0,4,512);
const fm=tex('./assets/scenery/ground-coal-gravel-v1.png'),fn=tex('./assets/scenery/ground-coal-gravel-v1-normal.png',false);for(const t of [fm,fn]){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(36,36);t.anisotropy=4;}
const floorMat=new THREE.MeshStandardMaterial({map:fm,normalMap:fn,alphaMap:new THREE.CanvasTexture(fc),transparent:true,depthWrite:false,roughness:.96,metalness:0,color:SCENES[0].floor});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),floorMat);floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.renderOrder=-2;scene.add(floor);
// 背景の板。幅64、中心の高さ10.5、奥行きはゲームと同じ。軸は板の縦の中心線
const pivot=new THREE.Group();pivot.position.set(0,0,stageZ(-15));scene.add(pivot);
const backMat=new THREE.MeshBasicMaterial({map:tex(SCENES[0].bg),transparent:true,alphaTest:.1,side:THREE.DoubleSide});
const back=new THREE.Mesh(new THREE.PlaneGeometry(64,1),backMat);back.position.y=10.5;back.renderOrder=-3;pivot.add(back);
// 台車（坑道入口の小道具。ゲームと同じ位置と大きさ）
const cart=new THREE.Sprite(new THREE.SpriteMaterial({map:tex('./assets/scenery/mine-cart-v1.png'),alphaTest:.1}));cart.center.set(.5,0);cart.scale.set(4.5,3,1);cart.position.set(-11.3,-3*66/1024,stageZ(-10));scene.add(cart);
function standee(p){const g=new THREE.Group(),s=p.sheet,body=s.figure[3]-s.figure[1],w=s.width/body,h=s.height/body;
 for(const [i,side] of ['front','back'].entries()){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex(`./art-preview/characters/${p.id}-v64-${side}.png`),transparent:true,alphaTest:.04}));
  m.position.set((s.width/2-(s.figure[0]+s.figure[2])/2)/body,(s.figure[3]-s.height/2)/body,i?-.008:.008);m.rotation.y=i?Math.PI:0;g.add(m);}
 g.scale.setScalar(4.8*p.cm/172);g.position.set(p.x,0,p.z);scene.add(g);return g;}
PARTY.forEach(standee);
// カメラ：ふだんはゲームと同じ客席。回る間は後ろへ引く（板の端が振り出す奥行き約24より後ろ）
const look=3.8+20*2*(HORIZON/100-.5)*Math.tan(FOV*Math.PI/360);
const SEAT={pos:new THREE.Vector3(0,3.8,10),look:new THREE.Vector3(0,look,-10)},WIDE={pos:new THREE.Vector3(0,11,40),look:new THREE.Vector3(0,6,-8)};
function place(k){camera.position.lerpVectors(SEAT.pos,WIDE.pos,k);camera.lookAt(new THREE.Vector3().lerpVectors(SEAT.look,WIDE.look,k));}
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host);
const smooth=t=>t<=0?0:t>=1?1:t*t*t*(t*(t*6-15)+10),clamp=t=>Math.max(0,Math.min(1,t));
const PULL=.8,TURN=2,BACK=.8;
let cur=0,anim=null;
function setScene(i){cur=i;const sc=SCENES[i];backMat.map=tex(sc.bg);backMat.needsUpdate=true;back.scale.y=64*sc.aspect;cart.visible=sc.cart;floorMat.color.set(sc.floor);scene.background.set(sc.sky);placeEl.textContent=sc.name;}
function start(){if(anim)return;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;anim={next:(cur+1)%SCENES.length,t0:performance.now(),reduced,total:reduced?.9:PULL+TURN+BACK,swapped:false};go.disabled=true;}
function step(now){if(!anim)return;const a=anim,el=(now-a.t0)/1000;
 if(a.reduced){// 動きを減らす設定：今のゲームと同じ暗転・明転
  const t=clamp(el/a.total);fadeEl.style.opacity=String(1-Math.abs(t*2-1));if(t>=.5&&!a.swapped){a.swapped=true;setScene(a.next);}
  if(t>=1){anim=null;go.disabled=false;}return;}
 place(el<PULL?smooth(el/PULL):el<PULL+TURN?1:1-smooth((el-PULL-TURN)/BACK));
 // 0→90°で真横、そこで絵を差し替えて −90°→0° へ。全体で半回転
 const r=smooth(clamp((el-PULL)/TURN));
 if(r>=.5&&!a.swapped){a.swapped=true;setScene(a.next);}
 pivot.rotation.y=r<.5?Math.PI*r:Math.PI*(r-1);
 if(el>=a.total){pivot.rotation.y=0;place(0);anim=null;go.disabled=false;}}
go.onclick=start;
function frame(now){requestAnimationFrame(frame);step(now);renderer.render(scene,camera);}
setScene(0);place(0);requestAnimationFrame(frame);
// 確認用：転換の途中の指定した秒数へ進める
window.__lab={start,seek(s){if(anim)anim.t0=performance.now()-s*1000;},get busy(){return !!anim}};
</script>
</html>
