<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>背景の凹凸の試験台</title>
<style>
:root{color-scheme:dark;--bg:#101817;--panel:#192726;--line:#344947;--text:#eee9dc;--muted:#a7b8b5;--gold:#dabc79}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 system-ui,sans-serif;display:grid;grid-template-columns:1fr 300px}
#stage{position:relative;min-height:60vh}#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:12px;pointer-events:none}
aside{background:var(--panel);border-left:1px solid var(--line);padding:14px 16px;overflow:auto;max-height:100vh}
h1{font-family:Georgia,"Yu Mincho",serif;font-weight:500;font-size:19px;margin:0 0 4px}p{margin:0 0 10px;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:6px;margin:0 0 12px;padding:8px 10px 10px}legend{color:var(--gold);padding:0 4px}
label{display:block;margin:6px 0 0}label span{display:flex;justify-content:space-between;color:var(--muted)}label output{color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--gold)}.row{display:flex;gap:6px;flex-wrap:wrap}.row label{display:inline-flex;gap:4px;margin:0;align-items:center}
button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px 10px;cursor:pointer;font:inherit}button:hover{border-color:var(--gold)}
#hold{width:100%;margin-bottom:8px;border-color:var(--gold);color:var(--gold)}#measure{font-variant-numeric:tabular-nums;color:var(--text);white-space:pre-line;margin-top:6px}
@media (max-width:760px){body{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);max-height:none}}
</style>
<div id="stage"><div id="hint">ゲームと同じ舞台・カメラ・照明（点灯時）。背景の描き方だけを替えています。</div></div>
<aside>
 <h1>背景の凹凸の試験台</h1>
 <p>坑道入口の背景を照明を受ける描き方にし、凹凸を付けます。普段の見た目は自己発光で保ちます。</p>
 <button id="hold">押している間だけ「今の描き方」</button>
 <fieldset><legend>背景の描き方</legend>
  <div class="row"><label><input type="radio" name="mode" value="basic">今の描き方</label><label><input type="radio" name="mode" value="bump" checked>バンプ</label><label><input type="radio" name="mode" value="normal">ノーマル</label></div>
  <label><span>凹凸の強さ<output data-for="relief"></output></span><input type="range" id="relief" min="0" max="4" step=".05" value="1"></label>
  <label><span>高さ画像のぼかし（px）<output data-for="blur"></output></span><input type="range" id="blur" min="0" max="8" step=".5" value="1.5"></label>
  <label><span>自己発光（普段の見た目）<output data-for="emissive"></output></span><input type="range" id="emissive" min="0" max="1.5" step=".05" value="1"></label>
  <label><span>照明を受ける割合<output data-for="diffuse"></output></span><input type="range" id="diffuse" min="0" max="1" step=".05" value=".3"></label>
  <label><span>粗さ<output data-for="rough"></output></span><input type="range" id="rough" min=".2" max="1" step=".05" value=".9"></label>
 </fieldset>
 <fieldset><legend>リディアのランタン</legend>
  <label><span>左右<output data-for="lx"></output></span><input type="range" id="lx" min="-14" max="14" step=".1" value="2"></label>
  <label><span>奥行き（大きいほど手前）<output data-for="lz"></output></span><input type="range" id="lz" min="-7.5" max="4" step=".1" value="2"></label>
  <label><span>高さ<output data-for="ly"></output></span><input type="range" id="ly" min=".3" max="7" step=".1" value="3"></label>
  <label><span>強さ<output data-for="li"></output></span><input type="range" id="li" min="0" max="30" step=".5" value="8"></label>
  <div class="row" style="margin-top:6px"><label><input type="checkbox" id="flicker" checked>揺らぎ</label><label><input type="checkbox" id="sweep">左右に往復</label></div>
 </fieldset>
 <fieldset><legend>舞台</legend>
  <label><span>全体光（点灯時は1.2）<output data-for="amb"></output></span><input type="range" id="amb" min="0" max="2" step=".05" value="1.2"></label>
  <label><span>見渡し 左右<output data-for="px"></output></span><input type="range" id="px" min="-6" max="6" step=".1" value="0"></label>
  <label><span>見渡し 上<output data-for="py"></output></span><input type="range" id="py" min="0" max="5" step=".1" value="0"></label>
 </fieldset>
 <fieldset><legend>測る・残す</legend>
  <div class="row"><button id="measureBtn">今の描き方との差を測る</button><button id="copy">設定を写す</button></div>
  <div id="measure">背景の範囲で、今の描き方からどれだけ明るさが変わったかを出します（揺らぎは止めて測ります）。</div>
 </fieldset>
</aside>
<script type="module">
import * as THREE from './vendor/three/three.module.min.js';
// 値はゲーム（stage.js・scenario.js、2026-10-07時点）と同じ。
const BG='../replay/img/mine_entrance_unlit.webp',FLOOR='./assets/scenery/ground-coal-gravel-v1.png',FLOOR_N='./assets/scenery/ground-coal-gravel-v1-normal.png';
const stageZ=z=>1+(z-1)*2.6/4.5,FOV=65,HORIZON=54;
const host=document.getElementById('stage'),$=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;host.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#182027');
const camera=new THREE.PerspectiveCamera(FOV,1,.1,100);
const loader=new THREE.TextureLoader(),tex=(u,srgb=true)=>{const t=loader.load(u,()=>dirty=true);if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;};
const ambient=new THREE.HemisphereLight('#a9bac6','#51412e',1.2);scene.add(ambient);
const lantern=new THREE.PointLight('#ffcc86',8,22,1);scene.add(lantern);
const bulb=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),new THREE.MeshBasicMaterial({color:'#ffcc86'}));scene.add(bulb);
// 床（ゲームと同じ絵・ノーマルマップ・坑道入口の色・奥の透明化）
const fc=document.createElement('canvas');fc.width=4;fc.height=512;const fx=fc.getContext('2d'),fg=fx.createLinearGradient(0,185,0,265);fg.addColorStop(0,'#000');fg.addColorStop(1,'#fff');fx.fillStyle=fg;fx.fillRect(0,0,4,512);
const fmap=tex(FLOOR),fnorm=tex(FLOOR_N,false);for(const t of [fmap,fnorm]){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(36,36);t.anisotropy=4;}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({map:fmap,normalMap:fnorm,alphaMap:new THREE.CanvasTexture(fc),transparent:true,depthWrite:false,roughness:.96,metalness:0,color:'#b6c0dc'}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.renderOrder=-2;scene.add(floor);
// 背景の板。幅64、縦は絵の比、中心の高さ10.5（stage.js の flat(null,0,-2,-15,64,25) と同じ）
const bgMap=tex(BG);let bgImage=null;
const back=new THREE.Mesh(new THREE.PlaneGeometry(64,64*614/1100),new THREE.MeshBasicMaterial({map:bgMap,transparent:true,alphaTest:.1,side:THREE.DoubleSide}));
back.position.set(0,10.5,stageZ(-15));back.renderOrder=-3;scene.add(back);
const basicMat=back.material;
const litMat=new THREE.MeshStandardMaterial({map:bgMap,emissiveMap:bgMap,emissive:new THREE.Color(1,1,1),transparent:true,alphaTest:.1,side:THREE.DoubleSide,metalness:0});
let bumpTex=null,normalTex=null,builtBlur=-1;
// 絵の明るさを高さとみなす。ぼかしは画素の段差がブロック状に出るのを抑える。
function heightCanvas(blur){const img=bgMap.image,c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.filter=`grayscale(1) blur(${blur}px)`;x.drawImage(img,0,0);return c;}
function rebuildMaps(){const blur=+$('blur').value;if(!bgMap.image||blur===builtBlur)return;builtBlur=blur;
 const hc=heightCanvas(blur);bumpTex?.dispose();bumpTex=new THREE.CanvasTexture(hc);bumpTex.colorSpace=THREE.NoColorSpace;
 const w=hc.width,h=hc.height,src=hc.getContext('2d').getImageData(0,0,w,h).data,H=(x,y)=>src[(Math.min(h-1,Math.max(0,y))*w+Math.min(w-1,Math.max(0,x)))*4]/255;
 const out=new ImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const gx=(H(x+1,y-1)+2*H(x+1,y)+H(x+1,y+1))-(H(x-1,y-1)+2*H(x-1,y)+H(x-1,y+1)),gy=(H(x-1,y-1)+2*H(x,y-1)+H(x+1,y-1))-(H(x-1,y+1)+2*H(x,y+1)+H(x+1,y+1));
  // gx は右向き、gy は上向き（画像の上が0行目）の勾配。法線は勾配の逆を向く
  let nx=-gx*2,ny=-gy*2,nz=1;const l=Math.hypot(nx,ny,nz);const i=(y*w+x)*4;out.data[i]=(nx/l*.5+.5)*255;out.data[i+1]=(ny/l*.5+.5)*255;out.data[i+2]=(nz/l*.5+.5)*255;out.data[i+3]=255;}
 const nc=document.createElement('canvas');nc.width=w;nc.height=h;nc.getContext('2d').putImageData(out,0,0);normalTex?.dispose();normalTex=new THREE.CanvasTexture(nc);normalTex.colorSpace=THREE.NoColorSpace;litMat.needsUpdate=true;}
let held=false,dirty=true;
function applyMaterial(){const mode=held?'basic':document.querySelector('[name=mode]:checked').value;
 if(mode==='basic'){back.material=basicMat;return;}
 rebuildMaps();back.material=litMat;const d=+$('diffuse').value,r=+$('relief').value;
 litMat.color.setScalar(d);litMat.emissiveIntensity=+$('emissive').value;litMat.roughness=+$('rough').value;
 litMat.bumpMap=mode==='bump'?bumpTex:null;litMat.bumpScale=r;litMat.normalMap=mode==='normal'?normalTex:null;litMat.normalScale.set(r,r);litMat.needsUpdate=true;}
function orient(){const px=+$('px').value,py=+$('py').value;camera.position.set(px,3.8+py,10);const y=camera.position.y+20*2*(HORIZON/100-.5)*Math.tan(FOV*Math.PI/360);camera.lookAt(px,y,-10);}
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true;}
new ResizeObserver(resize).observe(host);
for(const el of document.querySelectorAll('aside input'))el.addEventListener('input',()=>{for(const o of document.querySelectorAll(`output[data-for="${el.id}"]`))o.value=el.value;dirty=true;});
for(const o of document.querySelectorAll('output[data-for]'))o.value=$(o.dataset.for).value;
const hold=$('hold');hold.onpointerdown=()=>{held=true;dirty=true;};for(const ev of ['pointerup','pointerleave','pointercancel'])hold.addEventListener(ev,()=>{held=false;dirty=true;});
let freeze=false;
function frame(t){requestAnimationFrame(frame);const flick=$('flicker').checked&&!freeze,sweep=$('sweep').checked&&!freeze;if(!dirty&&!flick&&!sweep)return;dirty=false;
 const lx=sweep?12*Math.sin(t/1800):+$('lx').value;lantern.position.set(lx,+$('ly').value,+$('lz').value);bulb.position.copy(lantern.position);
 lantern.intensity=+$('li').value*(flick?1+.12*Math.sin(t/90)*Math.sin(t/37+1.3):1);ambient.intensity=+$('amb').value;
 applyMaterial();orient();renderer.render(scene,camera);}
requestAnimationFrame(frame);
// 背景の範囲（画面の上から0〜70%。床と交わる線より上）の明るさを、今の描き方と比べる。
function grab(){renderer.render(scene,camera);const c=renderer.domElement,k=document.createElement('canvas');k.width=c.width;k.height=c.height;const x=k.getContext('2d');x.drawImage(c,0,0);return x.getImageData(0,0,k.width,Math.floor(k.height*.7)).data;}
$('measureBtn').onclick=()=>{freeze=true;bulb.visible=false;const li=+$('li').value;lantern.intensity=li;orient();
 held=true;applyMaterial();const a=grab();held=false;applyMaterial();const b=grab();bulb.visible=true;freeze=false;dirty=true;
 let sum=0,sa=0,sb=0,big=0;const n=a.length/4;for(let i=0;i<a.length;i+=4){const la=.2126*a[i]+.7152*a[i+1]+.0722*a[i+2],lb=.2126*b[i]+.7152*b[i+1]+.0722*b[i+2];sum+=Math.abs(lb-la);sa+=la;sb+=lb;if(Math.abs(lb-la)>8)big++;}
 $('measure').textContent=`平均の明るさ（0〜255）：今 ${(sa/n).toFixed(1)} → この設定 ${(sb/n).toFixed(1)}\n画素ごとの差の平均：${(sum/n).toFixed(2)}\n差が8を超える画素：${(100*big/n).toFixed(1)}%`;};
$('copy').onclick=async()=>{const s={mode:document.querySelector('[name=mode]:checked').value};for(const el of document.querySelectorAll('aside input[type=range]'))s[el.id]=+el.value;const txt=JSON.stringify(s);try{await navigator.clipboard.writeText(txt);$('measure').textContent='写しました：'+txt;}catch{$('measure').textContent=txt;}};
for(const r of document.querySelectorAll('[name=mode]'))r.addEventListener('change',()=>dirty=true);
$('blur').addEventListener('input',()=>{builtBlur=-1;});
window.__lab={scene,back,litMat,renderer};
</script>
</html>
