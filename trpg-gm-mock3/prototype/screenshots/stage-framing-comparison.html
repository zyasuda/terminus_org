<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舞台の構図・同じ立ち位置で比較</title><style>body{background:#101817;color:#ede9dc;font-family:system-ui,sans-serif;margin:24px}h1{font-size:22px}p{font-size:13px;color:#b7c6c0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0}figcaption{padding:12px 0;color:#d9b875}img{width:100%;border:1px solid #344b46;border-radius:8px}@media(max-width:760px){.compare{grid-template-columns:1fr}}</style><h1>舞台の構図を比較</h1><p>同じ立ち位置・点灯状態・正面視線です。環境演出の時間を止め、カメラと舞台の奥行きだけを変えています。</p><div class="compare"><figure><figcaption>調整前相当：視野角48°・前後幅4.5・消失点46%</figcaption><img src="stage-framing-before.png" alt="大きい人物と深い舞台の構図"></figure><figure><figcaption>調整後：視野角65°・前後幅2.6・消失点54%</figcaption><img src="stage-framing-after.png" alt="小さめの人物と前後を縮めた舞台の構図"></figure></div><p>首振りの既定値は左右20°。GM設定 → 演出の調整 → 舞台の視線から4つの値をその場で調整できます。背景画の中に描かれた遠近は画像そのものに含まれます。</p></html>
