<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>灯りの番人 リプレイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* レイアウト概念: 製図紙の上に、ミナの遊ぶ画面(PC版1枚)を据え、その下に時間軸と解説を敷く。
   通話の声は文字にして吹き出しに出し、GMにも渡す(2026-10-02 決定、案C)。
   画面の中は「場面の絵+人物」と「記録」の2面。声は吹き出し、ゲームへの入力と結果は記録、と置き場所を分ける。
   署名: 通話の場面では記録が止まったまま、吹き出しだけが次々に出る。 */
:root{
  --paper:#e3e7ea; --grid:rgba(29,36,51,.07); --ink:#1d2433; --ink-2:#4b5566; --rule:#c3cad1; --panel:#f1f3f5;
  --lantern:#b86f0e; --stone:#17839a; --rust:#a3402a;
  --f-display:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  /* 遊ぶ画面の中は、テーマに関係なく坑道の暗さで固定する */
  --g-bg:#0d0f12; --g-bg2:#16191e; --g-ink:#ece6d8; --g-dim:#9a9282; --g-line:rgba(236,230,216,.14);
  --g-amber:#e8a33d; --g-cyan:#57c9da; --g-red:#e0573a; --g-bubble:#f4efe3; --g-bubble-ink:#1c1912;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161b; --grid:rgba(200,220,240,.045); --ink:#e4e8ee; --ink-2:#9aa5b3; --rule:#2b333d; --panel:#181d24;
  --lantern:#e2a23e; --stone:#4cc3d6; --rust:#d9684c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161b; --grid:rgba(200,220,240,.045); --ink:#e4e8ee; --ink-2:#9aa5b3; --rule:#2b333d; --panel:#181d24;
  --lantern:#e2a23e; --stone:#4cc3d6; --rust:#d9684c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,42px);line-height:1.1;margin:0;letter-spacing:.04em}
.sub{color:var(--ink-2);font-size:13px;margin:0}
.sub b{color:var(--ink)}

/* 遊ぶ画面(PC版を1枚。狭い幅では縦に積む) */
.game{background:var(--g-bg);color:var(--g-ink);border-radius:12px;overflow:hidden;box-shadow:0 18px 40px -20px rgba(0,0,0,.6);
  border:8px solid #05060a;container-type:inline-size}
.gbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--g-line);font-size:12.5px;color:var(--g-dim)}
.gbar .scn{color:var(--g-ink);font-family:var(--f-display);font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .me{display:flex;align-items:center;gap:6px}
.party{display:flex;gap:4px}
.pdot{width:22px;height:22px;border-radius:50%;background:#333 center 10%/160% auto no-repeat;border:1.5px solid transparent;display:inline-block}
.pdot.talk{border-color:var(--g-bubble);box-shadow:0 0 8px rgba(244,239,227,.6)}
.pdot.ai{border-color:var(--g-cyan);border-style:dashed}
.gbar .me i{width:22px;height:22px;border-radius:50%;background:#333 center 12%/170% auto no-repeat;display:inline-block;border:1.5px solid var(--g-cyan)}
.gmain{display:grid;grid-template-columns:minmax(0,1fr) 340px}
@container (max-width:820px){.gmain{grid-template-columns:minmax(0,1fr)}}

/* 場面 */
.stage{position:relative;aspect-ratio:16/10;background:#000 center/cover no-repeat;overflow:hidden}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(13,15,18,.78));pointer-events:none;z-index:1}
.av{position:absolute;bottom:0;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center}
.av img{height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.av .nm{position:absolute;bottom:-2px;font-size:11px;white-space:nowrap;background:rgba(13,15,18,.8);border:1px solid var(--g-line);border-radius:9px;padding:0 7px;color:var(--g-ink);z-index:2}
.av .nm small{color:var(--g-dim);margin-left:4px;font-size:10px}
.av .nm.hurt small{color:var(--g-red)}
.av.lit img{filter:drop-shadow(0 0 14px rgba(232,163,61,.85)) drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.av.talk img{filter:drop-shadow(0 0 16px rgba(244,239,227,.7)) drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.av.ai img{filter:drop-shadow(0 0 10px rgba(87,201,218,.8)) saturate(.6)}
.av.ai .nm{border-color:var(--g-cyan);border-style:dashed}
.av.idle .nm{border-color:var(--g-amber)}
.gmb{position:absolute;z-index:6;top:12px;right:12px;display:grid;justify-items:center;gap:3px}
.gmb span.f{width:clamp(56px,8cqi,92px);aspect-ratio:1;border-radius:50%;background:#2a2d33 url(img/gm.webp) center 4%/120% auto no-repeat;border:2px solid var(--g-line);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.gmb.lit span.f{border-color:var(--g-amber);box-shadow:0 0 18px rgba(232,163,61,.7)}
.gmb b{font-size:10.5px;font-weight:400;background:rgba(13,15,18,.8);border:1px solid var(--g-line);border-radius:9px;padding:0 8px}
.self{position:absolute;z-index:6;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:rgba(13,15,18,.86);border:1.5px solid var(--g-cyan);border-radius:30px;padding:4px 12px 4px 4px}
.self span.f{width:clamp(40px,5cqi,54px);aspect-ratio:1;border-radius:50%;background:#2a2d33 center 8%/150% auto no-repeat}
.self .t{display:grid;font-size:11.5px;line-height:1.35}
.self .t b{font-weight:700;font-size:12.5px}
.self .t small{color:var(--g-dim)}
.self.lit{box-shadow:0 0 18px rgba(232,163,61,.7);border-color:var(--g-amber)}
.self.talk{box-shadow:0 0 16px rgba(244,239,227,.55)}
.npc{position:absolute;bottom:0;transform:translateX(-50%);z-index:2}
.npc img{height:100%;width:auto;filter:drop-shadow(0 8px 20px rgba(0,0,0,.7))}
.npc.boss img{filter:drop-shadow(0 0 30px rgba(224,87,58,.35))}
.bub{position:absolute;z-index:6;transform:translateX(-50%);width:max-content;max-width:min(30%,260px);background:var(--g-bubble);color:var(--g-bubble-ink);
  border-radius:12px;padding:6px 10px 7px;font-size:13px;line-height:1.5;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--g-bubble)}
.bub b{display:block;font-size:10.5px;color:#7a6d55;letter-spacing:.06em}
.bub.ai{background:#0f2a30;color:#d6f3f7;border:1.5px dashed var(--g-cyan)}
.bub.ai::after{border-top-color:var(--g-cyan)}
.bub.ai b{color:var(--g-cyan)}
.bub.npc{background:#efe6d2}
@media (prefers-reduced-motion:no-preference){.bub{animation:pop .35s ease-out}}
@keyframes pop{from{opacity:0;transform:translate(-50%,6px) scale(.96)}}
.tag{position:absolute;z-index:2;transform:translate(-50%,-50%);font-size:12px;background:rgba(13,15,18,.78);border:1px solid var(--g-line);
  color:var(--g-ink);padding:3px 9px;border-radius:12px;white-space:nowrap;display:flex;gap:5px;align-items:center}
.tag i{display:inline-block;width:18px;height:18px;border-radius:50%;background:#333 center 12%/170% auto no-repeat;border:1px solid var(--g-amber)}
.inset{position:absolute;z-index:7;top:12px;left:12px;width:min(46%,320px);background:rgba(13,15,18,.94);border:1.5px dashed var(--g-cyan);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.inset .h{display:flex;align-items:center;gap:8px;color:var(--g-cyan);font-size:11.5px;letter-spacing:.06em;margin-bottom:4px}
.inset .h i{width:24px;height:24px;border-radius:50%;background:#333 center 12%/170% auto no-repeat;display:inline-block;flex:none}
.inset .chips{padding-top:6px}
.inset.low{top:28%}
@media (prefers-reduced-motion:no-preference){.inset{animation:pop2 .45s ease-out}}
@keyframes pop2{from{opacity:0;transform:translateY(-6px)}}
.tele{position:absolute;left:12px;top:12px;max-width:52%;z-index:5;background:rgba(13,15,18,.88);border:1px solid var(--g-red);border-radius:8px;padding:8px 11px;font-size:13px}
.tele .k{font-size:10.5px;letter-spacing:.12em;color:var(--g-red)}
.bhp{margin-top:6px;font-family:var(--f-mono);font-size:11.5px}
.bhp.over{display:none;position:absolute;z-index:5;left:83%;bottom:2%;width:26%;transform:translateX(-50%);margin:0;font-size:10px;text-align:center;background:rgba(13,15,18,.8);border-radius:6px;padding:2px 6px 4px}
.bar{height:6px;background:rgba(236,230,216,.12);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--g-red)}
.plat{position:absolute;z-index:1;left:78%;bottom:4%;width:48%;height:14%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 45%,rgba(224,87,58,.22),rgba(0,0,0,.55) 55%,transparent 72%)}
.av.back{z-index:3}
.av.rear{z-index:4}
.bnm{position:absolute;transform:translateX(-50%);z-index:6;font-size:11px;white-space:nowrap;background:rgba(13,15,18,.85);border:1px solid var(--g-line);border-radius:7px;padding:2px 7px 4px;color:var(--g-ink);line-height:1.3}
.bnm small{color:var(--g-dim);margin-left:4px;font-size:10px}
.bnm.ai{border-color:var(--g-cyan);border-style:dashed}
.bnm .hb{display:block;height:4px;margin-top:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bnm .hb i{display:block;height:100%;background:#6fbf73}
.bnm .hb i.lo{background:var(--g-red)}

/* 卓(集合) */
.table{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(13,15,18,.55)}
.felt{position:relative;width:min(62%,540px);aspect-ratio:2/1.1;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#3a2a1c,#1d150e 70%);border:6px solid #4a3522;box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 20px 40px rgba(0,0,0,.5)}
.felt .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px;color:var(--g-dim);font-size:12px}
.felt .center b{font-family:var(--f-display);font-weight:400;color:var(--g-ink);font-size:clamp(16px,2.4cqi,24px)}
.seatx{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;font-size:11.5px;line-height:1.3;color:var(--g-ink);width:96px;text-align:center}
.seatx .c{width:clamp(38px,5.5cqi,56px);aspect-ratio:1;border-radius:50%;background:#2a2d33;border:2px solid var(--g-line);display:grid;place-items:center;font-family:var(--f-display);font-size:18px}
.seatx.me .c{border-color:var(--g-cyan)}
.seatx.empty .c{border-style:dashed;color:var(--g-dim);background:transparent}
.seatx.empty{color:var(--g-dim)}
.seatx.talk .c{border-color:var(--g-bubble);box-shadow:0 0 14px rgba(244,239,227,.5)}
.seatx small{color:var(--g-dim);font-size:10px}
.seatx .bub{bottom:calc(100% + 8px);left:50%;max-width:200px}

/* 仲間を選ぶ・持ち越し */
.cast,.carry{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:5% 3% 6%;background:rgba(13,15,18,.5)}
.cc,.cy{border:1px solid var(--g-line);border-radius:10px;background:rgba(22,25,30,.9);padding:6px;display:grid;gap:3px;text-align:center;position:relative;grid-template-rows:minmax(0,1fr) auto auto;min-height:0}
.cc img,.cy img{width:100%;height:100%;object-fit:contain;min-height:0}
.cc .n,.cy b{font-family:var(--f-display);font-weight:400;font-size:15px}
.cc .r{font-size:10.5px;color:var(--g-dim);line-height:1.4}
.cy span{font-size:11.5px;line-height:1.45}
.cc.taken{border-color:var(--g-amber)}
.cc .by{position:absolute;top:6px;left:6px;font-size:10.5px;background:var(--g-amber);color:#1a1205;border-radius:8px;padding:0 7px}
.cc.mine,.cy.mine{border-color:var(--g-cyan)}
.cc.mine .by{background:var(--g-cyan)}

/* 記録 */
.side{display:flex;flex-direction:column;border-left:1px solid var(--g-line);min-width:0;position:relative}
.side-in{position:absolute;inset:0;display:flex;flex-direction:column}
@container (max-width:820px){.side{border-left:0;border-top:1px solid var(--g-line);height:320px}}
.side .lh{font-size:10.5px;letter-spacing:.14em;color:var(--g-dim);padding:8px 14px 0;display:flex;justify-content:space-between;gap:8px}
.log{display:flex;flex-direction:column;gap:8px;padding:10px 14px 12px;font-size:13.5px;line-height:1.65;overflow:auto;flex:1;min-height:0}
.ln{padding-left:10px;border-left:2px solid var(--g-line);opacity:.6}
.ln.new{opacity:1}
.ln .who{font-size:10.5px;letter-spacing:.1em;color:var(--g-dim);display:block}
.ln.gm{border-color:var(--g-amber)} .ln.gm .who{color:var(--g-amber)}
.ln.me{border-color:#6c6656;color:#d8d1c0}
.ln.sys{border:none;padding:0;font-size:12px;color:var(--g-dim)}
.seal{position:relative;background:linear-gradient(180deg,rgba(87,201,218,.13),rgba(87,201,218,.05));border:1px solid rgba(87,201,218,.45);border-radius:6px;padding:8px 10px 8px 12px;opacity:.7}
.seal.new{opacity:1}
.seal .who{font-size:10.5px;letter-spacing:.1em;display:block;color:var(--g-cyan)}
.seal::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;background:var(--g-cyan);border-radius:2px}
.seal h4{margin:2px 0;font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--g-cyan)}
.notice{font-size:12px;color:var(--g-cyan);display:flex;gap:6px;align-items:center;opacity:.65}
.notice.new{opacity:1}
.notice::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--g-cyan);flex:none}
.dice{display:flex;align-items:center;gap:10px;font-size:12.5px;opacity:.6}
.dice.new{opacity:1}
.d20{width:40px;height:40px;flex:none;object-fit:contain}
.roll{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);z-index:7;height:62%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.roll img{flex:1;min-height:0;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(0,0,0,.55))}
.roll.go img{animation:d20Jump 1.25s cubic-bezier(.2,.8,.15,1) both}
.roll.land img{animation:d20Land .42s ease-out both}
.roll .rl{font-size:12.5px;background:rgba(13,15,18,.85);border:1px solid var(--g-line);border-radius:8px;padding:3px 10px;white-space:nowrap}
.roll .rl b.ok{color:var(--g-amber)} .roll .rl b.ng{color:var(--g-red)}
.roll button{pointer-events:auto;font:700 14px var(--f-body);color:#2b080b;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;background:linear-gradient(#ffd2a6,#f15a43);box-shadow:0 5px 0 #7c1b22}
.roll button:focus-visible{outline:2px solid var(--g-ink);outline-offset:3px}
@keyframes d20Jump{0%{transform:translateY(0) scale(1)}20%{transform:translateY(-34%) scale(.94)}62%{transform:translateY(-7%) scale(1.07)}82%{transform:translateY(0) scale(.96)}100%{transform:none}}
@keyframes d20Land{0%{transform:translateY(-4%) scale(1.06)}100%{transform:none}}
.log.pending .new:not(.me){display:none}
@container (max-width:560px){.roll{left:56%!important;bottom:30%!important;height:58%!important}.roll .rl{font-size:10px;white-space:normal;text-align:center;max-width:80vw}.roll button{font-size:12px;padding:6px 14px}}
@media (prefers-reduced-motion:reduce){.roll.go img,.roll.land img{animation:none}}
.dice .ok{color:var(--g-amber)} .dice .ng{color:var(--g-red)}
.queue{display:grid;gap:4px;padding:10px 14px 8px;border-bottom:1px solid var(--g-line)}
.queue .qh{font-size:10.5px;letter-spacing:.08em;color:var(--g-dim);display:flex;justify-content:space-between;gap:8px}
.q{display:grid;grid-template-columns:16px 22px minmax(0,1fr);gap:0 8px;align-items:center;font-size:12.5px;background:var(--g-bg2);border:1px solid var(--g-line);border-radius:6px;padding:3px 8px}
.q .no{font-family:var(--f-mono);color:var(--g-amber);text-align:center}
.q .pd{width:22px;height:22px;border-radius:50%;background:#333 center 12%/170% auto no-repeat}
.q .res{grid-column:3;font-family:var(--f-mono);font-size:11px;color:var(--g-amber)}
.q.foe{border-color:rgba(224,87,58,.5)} .q.foe .no,.q.foe .res{color:var(--g-red)}

/* 入力 */
.gfoot{border-top:1px solid var(--g-line);padding:8px 14px 10px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 11px;border-radius:14px;border:1px solid var(--g-amber);color:var(--g-amber)}
.chip.picked{background:var(--g-amber);color:#1a1205}
.input{padding:8px 12px;border:1px solid var(--g-line);border-radius:8px;font-size:12.5px;color:var(--g-dim);display:flex;justify-content:space-between;gap:8px}
.vote{padding:8px 10px;border:1px solid var(--g-amber);border-radius:8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.vt{font-size:11.5px;padding:1px 8px;border-radius:10px;background:rgba(236,230,216,.08)}
.vt.yes{color:var(--g-amber)} .vt.wait{color:var(--g-red)}
@container (max-width:560px){
  .bnm{font-size:9.5px;padding:1px 5px 3px}.bnm small{display:none}.bnm .hb{height:3px}
  .gbar .me{display:none}.pdot{width:18px;height:18px}.gbar{gap:6px;padding:7px 10px}
  .cast,.carry{grid-template-columns:repeat(3,minmax(0,1fr));overflow:auto}
  .av .nm{font-size:9px;padding:0 4px}.bub{font-size:10.5px;max-width:46%;padding:4px 7px}.tag{font-size:10px}
  .inset{width:70%;font-size:10.5px;padding:7px 9px}.tele{font-size:10px;max-width:44%;padding:4px 7px;left:6px;top:6px}.tele .k{font-size:9px}.tele .bhp{display:none}.bhp.over{display:block}
  .seatx{width:72px;font-size:10px}.felt{width:70%}}

/* 時間軸と解説 */
.below{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:900px){.below{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;min-width:0}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font-size:13px;padding:5px 12px;border:1px solid var(--ink);border-radius:16px}
.btn:focus-visible{outline:2px solid var(--stone);outline-offset:2px}
.btn[disabled]{opacity:.35;cursor:default}
.btn.primary{background:var(--ink);color:var(--paper)}
.pos{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-left:auto}
.track{position:relative;height:50px;margin:10px 7px 0}
.phase{position:absolute;top:0;height:18px;border-left:1px solid var(--rule);font-size:11px;color:var(--ink-2);padding-left:5px;white-space:nowrap;overflow:hidden}
.rail{position:absolute;left:0;right:0;top:30px;height:2px;background:var(--rule)}
.tick{all:unset;cursor:pointer;position:absolute;top:25px;width:8px;height:8px;margin-left:-6px;border-radius:50%;background:var(--paper);border:2px solid var(--ink-2)}
.tick:focus-visible{outline:2px solid var(--stone);outline-offset:2px}
.tick.done{background:var(--ink-2)}
.tick.cur{background:var(--lantern);border-color:var(--lantern);transform:scale(1.5)}
.tm{position:absolute;top:38px;font-family:var(--f-mono);font-size:10px;color:var(--ink-2);transform:translateX(-50%)}
.label{font-size:11px;letter-spacing:.14em;color:var(--ink-2);margin:0 0 6px}
h2.step{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0;line-height:1.3;text-wrap:balance}
.stepmeta{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-bottom:8px}
.memo{font-size:14px;line-height:1.8;margin:0}
.hole{display:inline-block;margin-top:8px;font-size:12px;color:var(--rust);border:1px solid currentColor;border-radius:10px;padding:0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block;flex:none}

</div>

function history(i){

  const out = [];
  for(let k = j; k <= i; k++){
    (S[k].mine||[]).forEach(e => out.push({e:["mine",...e], fresh:k===i}));
    (S[k].log||[]).forEach(e => out.push({e, fresh:k===i}));

}

/* 人物の立ち位置: [左からの%, 高さの%, 下からの%]。高さは身長(cm)に比例させる。180cm = 場面の高さの44% */

function layout(s){
  /* 戦闘は手前から見た構図。後衛は一番手前(大きく、下が切れる)、前衛はその先で番人に近い(小さく、高い) */
  if(s.mode==="battle") return {self:false, row:{ines:"後衛",lydia:"後衛",maren:"後衛",brom:"前衛",gareth:"前衛"},
    pos:{ines:[10,tall("ines",68),-28],lydia:[23,tall("lydia",68),-28],maren:[36,tall("maren",68),-28],brom:[50,tall("brom",46),4],gareth:[61,tall("gareth",46),4]}};
  /* 探索では自分(ミナ)を場面に出さない。自分は左下の札で表す */
  /* 戦闘以外は、この場面で話した人・宣言した人だけを出す */
  const act = new Set([...(s.lit||[]), ...(s.voice||[]).map(v=>speakerId(v[0])), ...(s.log||[]).filter(e=>e[0]==="me").map(e=>e[1])]);
  const others = IDS.filter(id => id !== ME && act.has(id)), n = others.length, mid = s.npc ? 44 : 54;
  return {self:true, pos:Object.fromEntries(others.map((id,i)=>[id,[mid+(i-(n-1)/2)*13,tall(id,44),0]]))};
}

/* 吹き出しは最新3つまで(狭い画面では2つ)。古いものほど上に積む */
function bubblesHTML(s, L){
  const v = (s.voice||[]).slice(innerWidth < 600 ? -2 : -3), n = v.length;
  return v.map(([w,t],k) => {
    const id = speakerId(w), up = (n-1-k)*(innerWidth < 600 ? 22 : 13);
    let x, base;
    if(id==="myra"){ x = 64; base = 70; }
    else if(L && L.self && id===ME){ x = 16; base = 15; }
    else if(L && L.pos[id]){ const [px,ht,b] = L.pos[id]; x = px; base = ht + b + 3; }
    else if(s.mode==="select" && IDS.includes(id)){ x = 10 + IDS.indexOf(id)*20; base = 74; }
    else { x = 22 + k*28; base = 74; }
    x = Math.min(84, Math.max(16, x));
    const cls = w==="ai" ? "ai" : id==="myra" ? "npc" : "";
    const who = w==="ai" ? "マレン(AI代役・文字)" : w==="myra" ? "マイラ" : `${w}${id===ME?"(あなた)":""}`;
    return `<div class="bub ${cls}" style="left:${x}%;bottom:${Math.min(base+up,86)}%"><b>${who}</b>${esc(t)}</div>`;
  }).join("");
}

    ? `<div class="q foe"><span class="no">!</span><span class="pd" style="background-image:url(${IMG("guardian_rampage")});background-size:220%;background-position:center 20%"></span><span>番人: ${esc(act)}</span>${res?`<span class="res">${esc(res)}</span>`:""}</div>`
    : `<div class="q"><span class="no">${i+1}</span><span class="pd" style="${faceBg(id)}"></span><span>${P[id].name}: ${esc(act)}</span>${res?`<span class="res">${esc(res)}</span>`:""}</div>`).join("");
  let hist = history(cur).map(entryHTML).join("");
  if(!hist) hist = `<div class="ln sys new">${s.mode==="lobby"?"全員がそろうと、GMが現れる。":s.mode==="select"?"5人から1人を選ぶ。選んだ人の名前が札に付く。":s.mode==="reveal"?"5人の話す理由を、全員に開く。":s.mode==="carry"?"話す理由と関係はここで外れる。キャラクターと手に入れたものだけが、次の冒険へ行く。":"(記録はまだ無い)"}</div>`;
  const quiet = (s.voice||[]).length && !(s.log||[]).length && !(s.mine||[]).length && s.mode!=="lobby" && s.mode!=="select";
  return `<div class="side"><div class="side-in">${q?`<div class="queue"><div class="qh"><span>${s.qh||"解決の順番(誰でも並べ替えられる)"}</span><span>${s.confirm||"解決済み"}</span></div>${q}</div>`:""}
    <div class="lh"><span>記録</span><span>${quiet?"記録は増えない · 会話はGMも読んでいる":""}</span></div><div class="log" id="log">${hist}</div></div></div>`;
}
function footHTML(s){
  let h = "";
  if(s.vote) h += `<div class="vote"><span>奥の灯りの部屋へ進む?</span>${IDS.map(id=>`<span class="vt ${s.vote[id]}">${P[id].name} ${s.vote[id]==="yes"?"賛成":"まだ待って"}${(s.ai||[]).includes(id)?"(AI)":""}</span>`).join("")}</div>`;
  if(s.chips) h += `<div class="chips">${s.chips.map(c=>`<span class="chip ${c===s.picked?"picked":""}">${esc(c)}</span>`).join("")}</div>`;
  h += `<div class="input"><span>${s.mode==="battle"?"自分の行動を選ぶ / GMへ宣言する…":"GMへ宣言する…"}</span><span>送る</span></div>`;
  return `<div class="gfoot">${h}</div>`;
}

// 判定の場面では、ステージ中央でd20が転がって止まる。自分の判定はボタンを押してから振る
let rollT = [];
function rollDie(s){
  rollT.forEach(clearTimeout); rollT = [];
  const box = $("roll"), dz = (s.log||[]).find(e=>e[0]==="dice"); if(!box || !dz) return;
  const [,who,sk,r,m,dc] = dz, t = r+m, ok = t>=dc, img = $("rollimg");
  const lg = $("log"); lg.classList.add("pending");   // 振り終わるまで、この場面の結果は記録に出さない
  const go = () => { box.className = "roll go"; let f = 0;
    const iv = setInterval(() => { img.src = D20R(f = (f+1)%16); }, 55); rollT.push(iv);
    rollT.push(setTimeout(() => { clearInterval(iv); img.src = D20(r); box.className = "roll land"; lg.classList.remove("pending"); lg.scrollTop = lg.scrollHeight;
      box.querySelector("button, .rl").outerHTML = `<span class="rl">${P[who].name}の${sk}: ${r}${m?` + ${m}`:""} = ${t} / 難易度 ${dc} … <b class="${ok?"ok":"ng"}">${ok?"成功":"失敗"}</b></span>`; }, 1250)); };
  const btn = $("rollbtn");
  if(btn) btn.onclick = () => { btn.disabled = true; go(); }; else rollT.push(setTimeout(go, 300));
}
function render(){
  const s = S[cur];
  const dots = IDS.map(id => `<span class="pdot ${(s.voice||[]).some(v=>speakerId(v[0])===id)?"talk":""} ${(s.ai||[]).includes(id)?"ai":""}" style="${faceBg(id)}" title="${P[id].name}"></span>`).join("");
  $("game").innerHTML = `<div class="gbar"><span class="scn">${esc(s.title)}</span><span>${clock(s.t)}</span>
      <span class="party" aria-label="通話中の5人">${dots}</span><span class="me"><i style="${faceBg(ME)}"></i>ミナの画面</span></div>
    <div class="gmain">${stageHTML(s)}${sideHTML(s)}</div>${footHTML(s)}`;
  const lg = $("log"); if(lg) lg.scrollTop = lg.scrollHeight;
  rollDie(s);
  $("stitle").textContent = s.title;
  $("smeta").textContent = `${clock(s.t)} · ${s.ph} · 場面 ${cur+1}/${S.length}`;
  $("memo").textContent = s.memo;
  $("hole").hidden = !s.hole; $("hole").textContent = s.hole || "";
  $("pos").textContent = `${cur+1} / ${S.length}`;
  $("prev").disabled = cur===0; $("next").disabled = cur===S.length-1;
  let h = `<div class="rail"></div>`;
  PHASES.forEach(([n,t],i) => { const end = (PHASES[i+1]||[0,TOTAL])[1];
    h += `<span class="phase" style="left:${t/TOTAL*100}%;width:${(end-t)/TOTAL*100}%">${n}</span>`; });
  S.forEach((x,i) => h += `<button class="tick ${i<cur?"done":""} ${i===cur?"cur":""}" style="left:${x.t/TOTAL*100}%" data-i="${i}" aria-label="${clock(x.t)} ${x.title}"></button>`);
  [0,30,60,90,120].forEach(m => h += `<span class="tm" style="left:${m/TOTAL*100}%">${clock(m)}</span>`);
  $("track").innerHTML = h;
  $("track").querySelectorAll(".tick").forEach(b => b.onclick = () => { stop(); cur = +b.dataset.i; render(); });
}
function stop(){ if(timer){ clearInterval(timer); timer=null; $("play").textContent="自動で進める"; } }
const go = d => { stop(); const n = cur + d; if(n>=0 && n<S.length){ cur = n; render(); } };
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("play").onclick = () => {
  if(timer) return stop();
  $("play").textContent = "止める";
  timer = setInterval(() => { if(cur>=S.length-1) return stop(); cur++; render(); }, 6000);
};
document.addEventListener("keydown", e => { if(e.key==="ArrowRight") go(1); if(e.key==="ArrowLeft") go(-1); });
render();
</script>

</body></html>
