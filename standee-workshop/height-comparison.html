<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4人の表示身長</title><style>body{background:#182e30;color:#e6d9bd;font:16px system-ui;margin:20px}h1{font-size:22px}.row{display:flex;max-width:1200px;margin:auto}figure{width:25%;margin:0;text-align:center}canvas{width:100%;height:auto;border-bottom:1px solid #b69b62}a{color:#d0b577}</style><h1>4人の表示身長</h1><p>同じ縮尺・同じ床で比較しています。<a href="/">衣装部屋へ</a></p><div class="row" id="row"></div><script src="wardrobe.js"></script><script>
(async()=>{const W=Wardrobe,actors={gareth:W,maren:W.maren,lydia:W.lydia,brom:W.brom},names={gareth:'ガレス',maren:'マレン',lydia:'リディア',brom:'ブロム'};for(const [actor,rules] of Object.entries(actors)){const state=rules.initialState(),layers=rules.layers(state,'front'),images=new Map();await Promise.all(layers.map(async l=>{const i=new Image();i.src=l.src;await i.decode();images.set(l.src,i)}));const f=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=W.WIDTH;c.height=W.HEIGHT;label.textContent=names[actor]+' '+W.HEIGHT_CM[actor]+'cm';f.append(c,label);document.getElementById('row').append(f);const ctx=c.getContext('2d'),frame=W.displayFrame(actor,'front');ctx.translate(frame.x,frame.y);ctx.scale(frame.scale,frame.scale);W.drawView(ctx,layers,images,(w,h)=>Object.assign(document.createElement('canvas'),{width:w,height:h}));}})().catch(e=>document.getElementById('row').textContent=e.message);
</script></html>
