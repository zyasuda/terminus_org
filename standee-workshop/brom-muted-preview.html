<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ブロム・反映後の12姿</title>
<style>body{margin:0;background:#182e30;color:#e6d9bd;font:16px system-ui;padding:20px}main{max-width:1300px;margin:auto}h1{font-size:22px}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:0;padding:12px;background:#203739;border:1px solid #736243}figcaption{color:#d0b577}section{display:flex}canvas{width:50%;height:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style>
<main><h1>ブロム・反映後の12姿</h1><p>6通りの装備を、同じ配置と色調補正で表示しています。各組は左が正面、右が背面です。<a href="/" style="color:#d0b577">衣装部屋へ</a></p><div class="grid" id="grid"></div></main>
<script src="wardrobe.js"></script><script>
(async()=>{const W=Wardrobe,B=W.brom,images=new Map();const files=[...new Set(Object.values(B.BROM_SRC).flatMap(p=>Object.values(p).map(q=>W.BROM_DIR+q.src)))];await Promise.all(files.map(async f=>{const i=new Image();i.src=f;await i.decode();images.set(f,i)}));for(const hand of ['none','hammer','axe'])for(const shield of [false,true]){const s={hammer:hand==='hammer',axe:hand==='axe',shield,view:'front'},f=document.createElement('figure'),label=document.createElement('figcaption'),row=document.createElement('section');label.textContent=B.outfitLabel(s);f.append(label,row);for(const v of ['front','back']){const c=document.createElement('canvas');c.width=W.WIDTH;c.height=700;c.setAttribute('aria-label',label.textContent+'・'+(v==='front'?'正面':'背面'));row.append(c);const ctx=c.getContext('2d');ctx.translate(0,-480);W.drawView(ctx,B.layers(s,v),images,()=>document.createElement('canvas'))}document.getElementById('grid').append(f)}})().catch(e=>document.getElementById('grid').textContent='読み込み失敗：'+e.message);
</script></html>
