<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>廃坑の灯</title>
<style>
/* ───────────────────────────────────────────────
   廃坑の灯 — ゲームブックプレイヤー

   色は2系統だけ。暖色(炎)＝あなたの行動、寒色(心石)＝見つけたもの。
   物語の対立（人間のランタン / 機械の青白い光）を、そのまま
   UIの意味づけに使っている。錆色は危険だけに割り当てる。
   ─────────────────────────────────────────────── */
:root {
  --stone:  #0F1418;   /* 濡れた粘板岩。純黒にしない */
  --soot:   #171E25;   /* 一段持ち上げた面 */
  --ash:    #C9C3B7;   /* 本文。紙寄りの暖かい灰 */
  --dim:    #6E7580;   /* 機構の文字（判定・所持品） */
  --flame:  #E4B064;   /* ランタンの炎。あなたの行動 */
  --heart:  #93C6D6;   /* 心石の青白。見つけたものだけ */
  --rust:   #B25A3D;   /* 錆。危険と遮断だけ */

  --prose: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP",
           "Source Han Serif JP", serif;
  --mech:  "Hiragino Sans", "Yu Gothic", YuGothic, "Noto Sans JP", sans-serif;

  --col: 32em;         /* 全角32文字前後。小説の一行に近い */
  --approach: 0;
  --reveal-char-delay: 33.333ms;
}

@property --pool { syntax: '<percentage>'; inherits: true; initial-value: 0%; }

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--stone);
  color: var(--ash);
}

body {
  font-family: var(--prose);
  font-size: 17px;
  line-height: 1.9;
  letter-spacing: .04em;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── ランタンの光溜まり ────────────────────────
   このページの署名。approachが上がるほど灯りが狭まり、
   縁から錆がにじむ。数値を出さずに接近を伝える。

   本文より必ず「奥」に置く(z-index:0)。文字の上に暗幕を掛ける形にすると
   接近するほど読めなくなり、可読性最優先という前提と衝突する。
   暗くなるのは部屋であって、文字ではない。 */
#lantern {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  --pool: 0%;
  background:
    radial-gradient(90% 62% at 50% 42%,
      color-mix(in srgb, var(--flame) 11%, transparent) 0%,
      color-mix(in srgb, var(--flame) 4%, transparent) calc(38% - var(--pool)),
      transparent calc(74% - var(--pool)));
  transition: --pool 1.2s ease;
}
#lantern::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(125% 95% at 50% 42%,
    transparent 46%, color-mix(in srgb, var(--rust) 20%, transparent) 100%);
  opacity: calc(var(--approach) / 3);
  transition: opacity 1.2s ease;
}

/* ── 上部の帯：常に見えている状態 ────────────── */
#rail {
  position: relative; z-index: 4;
  flex: 0 0 auto;
  border-bottom: 1px solid color-mix(in srgb, var(--ash) 12%, transparent);
  background: color-mix(in srgb, var(--soot) 70%, transparent);
  backdrop-filter: blur(6px);
  padding: .7rem max(1.1rem, env(safe-area-inset-left)) .7rem;
}
/* 帯は本文カラムより広く取る。同じ幅にすると場面名・所持品・体力が
   折り返して2行になり、常時表示という役目を果たさなくなる */
#railInner {
  max-width: 52em; margin: 0 auto;
  display: flex; align-items: baseline; gap: 1rem; flex-wrap: nowrap;
  font-family: var(--mech); font-size: 13px; line-height: 1.5;
  letter-spacing: .12em;
}
#place { color: var(--ash); font-size: 15px; letter-spacing: .18em; white-space: nowrap; }
#chapter { color: var(--dim); font-size: 11px; white-space: nowrap; }
#vitals {
  margin-left: auto; min-width: 0;
  display: flex; align-items: center; gap: .9rem;
}

/* HPは割合ではなく「あと何発耐えられるか」の刻み */
#hp { display: flex; gap: 3px; }
#hp i { width: 3px; height: 13px; background: var(--flame); display: block; }
#hp i.lost { background: color-mix(in srgb, var(--ash) 18%, transparent); }

#bag {
  color: var(--dim); font-size: 11px; letter-spacing: .1em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26em;
}

#restart {
  font: inherit; font-size: 11px; letter-spacing: .1em; white-space: nowrap;
  background: none; border: 0; padding: .2rem .1rem;
  color: var(--dim); cursor: pointer;
}
#restart:hover { color: var(--ash); }

/* ── 本文 ──────────────────────────────────── */
#log {
  position: relative; z-index: 2;
  flex: 1 1 auto; overflow-y: auto;
  padding: 2.6rem 1.1rem 3rem;
  scroll-behavior: smooth;
}
#logInner { max-width: var(--col); margin: 0 auto; }

#log p { margin: 0 0 1.45em; }

/* 新しく届いた行だけが浮かび上がる。効果はここ一箇所だけ */
#log .in { animation: rise .32s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.reveal {
  color: var(--heart);
  border-left: 1px solid color-mix(in srgb, var(--heart) 55%, transparent);
  padding-left: 1.1em;
  margin-left: -1.1em;
}
.reveal .what {
  display: block;
  font-family: var(--mech); font-size: 11px; letter-spacing: .18em;
  color: color-mix(in srgb, var(--heart) 70%, var(--dim));
  margin-bottom: .3em;
}

.combat { color: color-mix(in srgb, var(--ash) 78%, var(--rust)); }
.blocked { color: var(--dim); }
.finish { color: var(--flame); }

/* 判定と入手は機構側。本文と混ぜない */
.tick {
  font-family: var(--mech); font-size: 12px; letter-spacing: .14em;
  line-height: 1.7; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.tick b { color: var(--ash); font-weight: 500; }
.tick.ok b { color: var(--flame); }
.tick.ng b { color: var(--rust); }
.tick.gain b { color: var(--heart); }

/* 場面の切れ目 */
.seam {
  display: flex; align-items: center; gap: 1rem;
  margin: 2.4em 0 1.9em;
  font-family: var(--mech); font-size: 11px; letter-spacing: .3em;
  color: var(--dim);
}
.seam::before, .seam::after {
  content: ""; height: 1px; flex: 1;
  background: color-mix(in srgb, var(--ash) 14%, transparent);
}
.seam::before { flex: 0 0 2rem; }

/* ── 選択肢 ────────────────────────────────── */
#choices {
  position: relative; z-index: 4;
  flex: 0 0 auto;
  border-top: 1px solid color-mix(in srgb, var(--ash) 12%, transparent);
  background: color-mix(in srgb, var(--soot) 88%, transparent);
  backdrop-filter: blur(6px);
  padding: .9rem 1.1rem calc(.9rem + env(safe-area-inset-bottom));
}
#choicesInner {
  max-width: var(--col); margin: 0 auto;
  display: flex; flex-direction: column; gap: 2px;
}

#choices button {
  font-family: var(--mech); font-size: 15px; letter-spacing: .06em;
  text-align: left;
  background: none; border: 0;
  border-left: 2px solid transparent;
  color: var(--ash);
  padding: .62rem .7rem .62rem 1rem;
  cursor: pointer;
  transition: color .16s, border-color .16s, background .16s;
}
#choices button:hover {
  color: var(--flame);
  border-left-color: var(--flame);
  background: color-mix(in srgb, var(--flame) 7%, transparent);
}
#choices button:focus-visible {
  outline: 1px solid var(--flame); outline-offset: -1px;
}
#choices button::before {
  content: "→"; color: var(--dim); margin-right: .8em;
  transition: color .16s;
}
#choices button:hover::before { color: var(--flame); }

/* 決断は割り込み。通常の候補と見分けがつくようにする */
#choicesInner.decision button { border-left-color: color-mix(in srgb, var(--flame) 35%, transparent); }
#prompt {
  font-family: var(--prose); font-size: 14px; color: var(--flame);
  letter-spacing: .04em; line-height: 1.8;
  margin: 0 0 .55rem; padding-left: 1rem;
}
#stuck {
  font-family: var(--mech); font-size: 12px; color: var(--dim);
  letter-spacing: .1em; padding: .5rem 1rem;
}

@media (max-width: 640px) {
  body { font-size: 16px; }
  #log { padding: 1.8rem 1rem 2rem; }
  #railInner { gap: .7rem; }
  #chapter { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  #log .in { animation: none; }
  :root { --reveal-char-delay: 0ms; }
  #lantern, #lantern::after { transition: none; }
  #log { scroll-behavior: auto; }
}
</style>
</head>
<body>
  <div id="lantern"></div>

  <header id="rail">
    <div id="railInner">
      <span id="place">—</span>
      <span id="chapter"></span>
      <span id="vitals">
        <span id="hp" title="体力"></span>
        <span id="bag"></span>
        <button id="restart" type="button">最初から</button>
      </span>
    </div>
  </header>

  <main id="log" tabindex="-1"><div id="logInner"></div></main>

  <footer id="choices"><div id="choicesInner"></div></footer>

  <script type="module" src="./src/ui.js"></script>
</body>
</html>
