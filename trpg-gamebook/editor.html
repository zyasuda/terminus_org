<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>廃坑の灯 — エディタ</title>
<style>
:root { --stone:#0F1418; --soot:#171E25; --ash:#C9C3B7; --dim:#6E7580; --flame:#E4B064; --heart:#93C6D6; --rust:#B25A3D; --prose:"Hiragino Mincho ProN","Yu Mincho",serif; --mech:"Hiragino Sans","Yu Gothic",sans-serif; }
* { box-sizing:border-box } body { margin:0; min-height:100vh; background:var(--stone); color:var(--ash); font:14px/1.6 var(--mech) }
button, input, textarea, select { font:inherit } button { color:inherit; background:none; border:0; cursor:pointer } button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--flame); outline-offset:2px }
header { display:flex; gap:1rem; align-items:center; padding:.8rem 1rem; border-bottom:1px solid color-mix(in srgb,var(--ash) 12%,transparent) } h1 { font-size:15px; margin:0; letter-spacing:.12em } #draft { color:var(--heart); font-size:12px } header button { color:var(--flame) } header button:first-of-type { margin-left:auto }
#app { display:grid; grid-template-columns:15rem minmax(0,1fr) 18rem; min-height:calc(100vh - 49px) } nav, aside { background:var(--soot); padding:1rem; border-color:color-mix(in srgb,var(--ash) 12%,transparent); border-style:solid } nav { border-width:0 1px 0 0 } aside { border-width:0 0 0 1px }
nav button { display:block; text-align:left; width:100%; padding:.45rem .55rem; color:var(--dim) } nav button[aria-current="true"] { color:var(--flame); background:color-mix(in srgb,var(--flame) 8%,transparent) } main { padding:1.4rem; max-width:56rem; width:100%; margin:auto } h2 { margin:0 0 1rem; font-size:18px } h3 { margin:1.8rem 0 .6rem; font-size:13px; color:var(--flame); letter-spacing:.1em }
label { display:block; margin:.75rem 0 .2rem; color:var(--dim); font-size:12px } input, textarea, select { width:100%; padding:.45rem 0; color:var(--ash); background:transparent; border:0; border-bottom:1px solid color-mix(in srgb,var(--ash) 12%,transparent); border-radius:0 } input:focus, textarea:focus, select:focus { border-bottom-color:var(--flame); outline:0 } textarea { min-height:5rem; resize:vertical; font-family:var(--prose); line-height:1.8 } select[multiple] { min-height:5rem; padding:.3rem }
.row { display:flex; gap:.6rem; align-items:center; padding:.6rem 0; border-bottom:1px solid color-mix(in srgb,var(--ash) 9%,transparent) }.row span { flex:1 }.row button, .add, .remove { color:var(--flame); padding:.2rem .35rem }.remove { color:var(--rust) }.actions { display:flex; gap:.7rem; margin-top:1rem }.actions button { border:1px solid color-mix(in srgb,var(--ash) 22%,transparent); padding:.45rem .7rem }.actions .danger { color:var(--rust) }
.ai-tabs [role="tab"][aria-selected="true"] { color:var(--flame) }
#result { position:sticky; top:0 } #summary { font-variant-numeric:tabular-nums; font-size:18px } #summary.error { color:var(--rust) } #summary.ok { color:var(--heart) } .metric { display:flex; justify-content:space-between; color:var(--dim); padding:.25rem 0 }.error { color:var(--rust) }.warn { color:var(--flame) }.ok { color:var(--heart) }.issue { padding:.55rem 0; border-bottom:1px solid color-mix(in srgb,var(--ash) 10%,transparent); font-size:12px }.issue small { color:var(--dim); display:block }.hint { color:var(--dim); font-size:12px }.hint.error { color:var(--rust) }.hint.ok { color:var(--heart) }.choice-hints button { color:var(--heart); padding:.2rem .35rem; margin:.25rem .25rem 0 0; border:1px solid color-mix(in srgb,var(--heart) 25%,transparent) }
#playlog-review { max-height:82vh; overflow:auto }
#ai-settings, #playlog-review { width:min(28rem,90vw); padding:1.4rem; color:var(--ash); background:var(--soot); border:1px solid color-mix(in srgb,var(--ash) 18%,transparent) }#ai-settings::backdrop, #playlog-review::backdrop { background:color-mix(in srgb,var(--stone) 82%,transparent) }#ai-settings h2, #playlog-review h2 { margin:0 0 .3rem }#gemini-close, #playlog-close { margin-top:1.3rem; color:var(--flame); padding:.45rem .7rem; border:1px solid color-mix(in srgb,var(--ash) 22%,transparent) }details summary { cursor:pointer; color:var(--flame) }.ai-panel { margin-bottom:1.4rem; padding:1rem; background:var(--soot); border:1px solid color-mix(in srgb,var(--heart) 20%,transparent) }.proposal button, [data-ai-form] button { color:var(--heart); padding:.2rem .35rem }.conversation { margin:.8rem 0 }.talk { padding:.5rem 0 }.talk p { margin:.15rem 0; white-space:pre-wrap }.talk.user { padding-left:1rem }.proposal { display:grid; gap:.15rem; margin:.6rem 0 .2rem; padding:.65rem; border:1px solid color-mix(in srgb,var(--heart) 25%,transparent); font-size:12px }.proposal span { color:var(--dim) } [data-ai-form] { display:flex; gap:.5rem; align-items:end } [data-ai-form] textarea { min-height:3rem; flex:1 } #chain { margin-bottom:1.4rem } .chain-line { padding-left:calc(var(--chain-depth) * 1.25rem); color:var(--ash) } .chain-count { color:var(--dim); margin-left:1rem } .chain-count.zero { color:var(--rust) } #author-form { display:block; border-top:1px solid color-mix(in srgb,var(--ash) 12%,transparent); padding-top:.8rem }
@media (max-width:800px) { #app { grid-template-columns:11rem 1fr } aside { grid-column:1 / -1; border-width:1px 0 0 } #result { position:static } } @media (max-width:540px) { #app { display:block } nav { border-width:0 0 1px; display:flex; overflow:auto } nav button { min-width:max-content } main { padding:1rem } }
</style>
</head>
<body>
<header><h1>廃坑の灯　編集</h1><span id="draft"></span><button id="ai-open" type="button">AI設定</button><button id="import" type="button">.jsonを読み込む</button><input type="file" id="import-file" accept=".json,application/json" hidden><button id="playlog" type="button">遊んだ記録を読み込む</button><input type="file" id="playlog-file" accept=".md,.txt,text/plain,text/markdown" hidden><button id="propose" type="button">正本への修正案を書き出す</button><button id="export" type="button">.jsonを書き出す</button><button id="discard" type="button">下書きを捨てる</button></header>
<dialog id="ai-settings"><h2>AI設定</h2><p class="hint">ここにAPIキーを入れてください。入力した原稿はGoogleへ送られます</p><label>Gemini APIキー<input id="gemini-key" type="password" autocomplete="off"></label><label>モデル<select id="gemini-model"><option value="">モデルを読み込みます</option></select></label><p id="gemini-status" class="hint"></p><button id="gemini-close" type="button">閉じる</button></dialog>
<dialog id="playlog-review"></dialog>
<div id="app"><nav id="toc" aria-label="場面"></nav><main id="editor"></main><aside><div id="result" aria-live="polite"></div></aside></div>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
