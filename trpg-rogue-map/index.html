<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>廃坑の灯 — 地図</title>
  <style>
    :root { --stone: #0F1418; --ash: #C9C3B7; --flame: #E4B064; --heart: #93C6D6; --rust: #B25A3D; --dim: #6E7580; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; overflow: hidden; background: var(--stone); color: var(--ash); font-family: system-ui, sans-serif; }
    /* 高さは100dvhで固定し、地図の行はminmax(0,1fr)で縮められるようにする。
       min-height+1fr だと、SVGがviewBoxの縦横比から本来の高さを取って行を押し広げ、
       移動ボタンが画面の外へ出る（実測: 390x844で下端937px）。 */
    main { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-width: 640px; margin: auto; }
    #rail { padding: max(12px, env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid color-mix(in srgb, var(--ash) 12%, transparent); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #place { font-size: 14px; letter-spacing: .12em; } #chapter { color: var(--dim); font-size: 11px; white-space: nowrap; }
    #map { position: relative; min-height: 0; overflow: hidden; }
    svg { width: 100%; height: 100%; display: block; touch-action: none; } .floor { fill: #454F5A; stroke: #454F5A; stroke-width: .14; }
    /* 記憶層は岩寄りの灰色（灯りが無い）。灯り層は炎色を重ねて、実際に照らしている感を出す。
       前回の実装はopacityだけで明暗を作っており、暖色が一切乗っていなかった（実機で確認して気づいた）。 */
    .floor-memory { opacity: .30; }
    .floor-light { fill: var(--flame); stroke: var(--flame); opacity: .16; mix-blend-mode: screen; animation: torch-brightness 6.1s ease-in-out infinite; }
    /* 床の形なりの塗りだけだと角ばって見えるため、独立した放射グラデーションを重ねる。
       これが空間へ光が回り込んでいる感を作る（実機で確認: 床の塗りだけでは角ばった塊に見えた）。 */
    .lamp-glow { mix-blend-mode: screen; pointer-events: none; animation: torch-brightness 6.1s ease-in-out infinite; } .torch-mask { transform-box: fill-box; transform-origin: center; animation: torch-flicker 4.7s ease-in-out infinite; }
    .room-name { fill: var(--ash); font-size: .45px; pointer-events: none; } .player { fill: var(--heart); stroke: var(--ash); stroke-width: .05; }
    #reset-view { position: absolute; z-index: 1; top: 12px; right: 12px; border: 1px solid color-mix(in srgb, var(--ash) 24%, transparent); border-radius: 999px; padding: 7px 12px; background: color-mix(in srgb, var(--stone) 82%, transparent); color: var(--ash); font-size: 12px; }
    @keyframes torch-flicker { 0%, 100% { opacity: .92; transform: scale(1); } 17% { opacity: .83; transform: scale(.96); } 43% { opacity: 1; transform: scale(1.04); } 71% { opacity: .88; transform: scale(.98); } }
    @keyframes torch-brightness { 0%, 100% { opacity: .92; } 29% { opacity: .81; } 58% { opacity: .98; } 84% { opacity: .86; } }
    @media (prefers-reduced-motion: reduce) { .torch-mask, .floor-light, .lamp-glow { animation: none; } }
    #controls { min-height: 68px; display: flex; align-items: stretch; justify-content: center; border-top: 1px solid color-mix(in srgb, var(--ash) 12%, transparent); }
    button { flex: 1; max-width: 120px; border: 0; border-left: 1px solid color-mix(in srgb, var(--ash) 10%, transparent); background: transparent; color: var(--flame); font-size: 26px; cursor: pointer; } button:last-child { border-right: 1px solid color-mix(in srgb, var(--ash) 10%, transparent); } button span { display: block; color: var(--dim); font-size: 9px; letter-spacing: .08em; }
  </style>
</head>
<body><main><header id="rail"><span id="place"></span><span id="chapter"></span></header><section id="map"></section><nav id="controls" aria-label="移動"></nav></main><script type="module" src="./src/ui.js"></script></body>
</html>
